name: Publish posts scheduled for today

on:
  schedule:
    # Run every day at 15:00 UTC (00:00 KST) or manually run
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get the date for today
        id: date
        run: echo "TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Check for scheduled posts and move to posts
        run: |
          echo "Today is $TODAY"
          shopt -s nullglob
          for file in _scheduled/${TODAY}-*.md; do
            echo "Found scheduled: $file"
            mv "$file" "_posts/"
            echo "Moved $file to _posts/"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _posts/
          git add _scheduled/
          git commit -m "Posted Scheduled Drafts on $TODAY" || echo "No changes to commit"
          git push
